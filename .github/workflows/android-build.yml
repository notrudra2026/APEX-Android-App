name: Android Build
on:
  push:
    branches: [main, master]
    paths: ['APEX-Complete (1).zip', 'APEX-Complete.zip', 'android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract APEX source archive
        run: |
          if [ -f "APEX-Complete (1).zip" ]; then
            unzip -o "APEX-Complete (1).zip" -d .
          elif [ -f "APEX-Complete.zip" ]; then
            unzip -o "APEX-Complete.zip" -d .
          else
            echo "APEX source ZIP not found" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
