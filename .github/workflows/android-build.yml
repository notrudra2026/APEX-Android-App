name: Android Build
on:
  push:
    branches: [main, master]
    paths: ['APEX-Complete (1).zip', 'APEX-Complete.zip', 'android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract APEX source archive
        run: |
          if [ -f "APEX-Complete (1).zip" ]; then
            unzip -o "APEX-Complete (1).zip" -d .
          elif [ -f "APEX-Complete.zip" ]; then
            unzip -o "APEX-Complete.zip" -d .
          else
            echo "APEX source ZIP not found" >&2
            exit 1
          fi
      - name: Inspect Kotlin source errors
        run: |
          echo "===== PROJECT FILES ====="
          find android/app/src/main -type f -name '*.kt' | sort
          echo "===== backendUrl REFERENCES AND DEFINITIONS ====="
          grep -R -n -C 3 'backendUrl' android/app/src/main || true
          echo "===== VOICE SCREEN ====="
          sed -n '1,180p' android/app/src/main/java/com/apex/agent/ui/screens/VoiceScreen.kt
          echo "===== SETTINGS SCREEN ====="
          sed -n '1,180p' android/app/src/main/java/com/apex/agent/ui/screens/SettingsScreen.kt
          echo "===== CHAT SCREEN ====="
          sed -n '1,100p' android/app/src/main/java/com/apex/agent/ui/screens/ChatScreen.kt
      - name: Apply source build fixes
        run: |
          sed -i 's#implementation("coil-compose:coil-compose:2.7.0")#implementation("io.coil-kt:coil-compose:2.7.0")#' android/app/build.gradle.kts
          sed -i 's/-Xmx2048m/-Xmx1024m/' android/gradle.properties || true
          sed -i 's/^            ) { Text("Health Check") }/            }) { Text("Health Check") }/' android/app/src/main/java/com/apex/agent/ui/screens/SettingsScreen.kt
          # Compose compiler 1.5.14 requires Kotlin 1.9.24.
          sed -i 's/org.jetbrains.kotlin.android") version "1.9.22"/org.jetbrains.kotlin.android") version "1.9.24"/' android/build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.plugin.serialization") version "1.9.22"/org.jetbrains.kotlin.plugin.serialization") version "1.9.24"/' android/build.gradle.kts
          sed -i 's/com.google.devtools.ksp") version "1.9.22-1.0.17"/com.google.devtools.ksp") version "1.9.24-1.0.20"/' android/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found in android/; cannot build" >&2
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
